<style>
:root{
  color-scheme: light;
  --bg:#F7F4EF; --card:#FFFFFF; --soft:#FBF9F5;
  --txt:#33302C; --mut:#7A7267; --hint:#A79E92;
  --line:#E9E3DA; --line2:#D8CFC3;
  --acc:#C97B5A; --accbg:#F4E2D9; --acctx:#8A4529;
  --blu:#4A6272; --blubg:#DFE6EB; --blutx:#2F4553;
  --grn:#5F8A7D; --grnbg:#DFEAE6; --grntx:#3A5E53;
  --amb:#A98545; --ambbg:#F0E8D8; --ambtx:#6E5522;
  --pur:#7A6A8C; --purbg:#EDE7F0; --purtx:#544763;
  --dan:#B5503F; --danbg:#FBE9E4; --dantx:#8C3325;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
html,body{margin:0;padding:0}
img,textarea,input,select{max-width:100%}
body{
  background:var(--bg);color:var(--txt);
  font-family:'Josefin Sans',system-ui,-apple-system,sans-serif;
  font-size:13px;line-height:1.4;
  padding:14px 16px 90px;
  max-width:1400px;margin:0 auto;
}
h1,h2,h3,h4{margin:0;font-weight:600}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:13px;color:var(--txt);background:#fff;border:1px solid var(--line2);border-radius:9px;padding:7px 10px;outline:none;width:100%}
/* en pantallas táctiles la letra sube a 16px: iOS acerca la pantalla si es menor */
@media (pointer:coarse){ input,select,textarea{font-size:16px !important} }
input:focus,select:focus,textarea:focus{border-color:var(--acc)}
textarea{resize:vertical;min-height:60px}

/* ---------- barra superior ---------- */
.top{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:4px}
.top h1{font-size:21px;letter-spacing:.01em}
.top .today{font-size:12px;color:var(--mut)}
.top .sem{font-size:11px;background:var(--accbg);color:var(--acctx);padding:2px 9px;border-radius:12px}
.tabs{display:flex;gap:5px;flex-wrap:wrap;margin:11px 0 15px;border-bottom:1px solid var(--line);padding-bottom:9px}
.tab{font-size:12.5px;padding:5px 13px;border-radius:14px;border:1px solid transparent;background:transparent;color:var(--mut)}
.tab:hover{background:var(--soft)}
.tab.on{background:var(--acc);color:#fff}
.spacer{flex:1}
.mini{font-size:11px;padding:4px 10px;border-radius:12px;border:1px solid var(--line2);background:#fff;color:var(--mut)}
.mini:hover{border-color:var(--acc);color:var(--acctx)}
.syncpill{font-size:10.5px;padding:3px 10px;border-radius:12px;white-space:nowrap;background:#EFEAE2;color:var(--mut)}
.syncpill.ok{background:var(--grnbg);color:var(--grntx)}
.syncpill.run{background:var(--ambbg);color:var(--ambtx)}
.syncpill.err{background:var(--danbg);color:var(--dantx)}
.syncbox{background:var(--blubg);border:1px solid var(--blu);border-radius:12px;padding:11px 12px;margin-bottom:6px}
.syncbox .ct{font-size:10px;color:var(--blutx);text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px;font-weight:600}
.syncbox .empty{color:var(--blutx);opacity:.85}
.syncbox label{color:var(--blutx)}

/* ---------- layout ---------- */
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start}
.box{background:var(--card);border-radius:13px;padding:12px 14px;margin-bottom:14px;border:1px solid var(--line)}
.bh{font-size:10.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;padding:3px 10px;border-radius:11px;display:inline-block;margin-bottom:9px}
.bh.a{background:var(--accbg);color:var(--acctx)}
.bh.n{background:#EFEAE2;color:#5A5348}
.bh.b{background:var(--blubg);color:var(--blutx)}
.bh.g{background:var(--grnbg);color:var(--grntx)}
.bh.p{background:var(--purbg);color:var(--purtx)}
.bh.m{background:var(--ambbg);color:var(--ambtx)}
.empty{font-size:11.5px;color:var(--hint);padding:4px 0}

/* ---------- alerta ---------- */
.alert{background:var(--danbg);border-left:3px solid var(--dan);border-radius:0 10px 10px 0;padding:9px 12px;font-size:12px;color:var(--dantx);margin-bottom:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.alert b{font-weight:600}
.alert button{font-size:11px;border:1px solid var(--dan);color:var(--dantx);background:#fff;border-radius:11px;padding:3px 11px;margin-left:auto}
.alert.warn{background:var(--ambbg);border-left-color:var(--amb);color:var(--ambtx)}
.alert.warn button{border-color:var(--amb);color:var(--ambtx)}

/* ---------- tareas ---------- */
.t{display:flex;gap:9px;align-items:center;padding:6px 4px 6px 12px;border-bottom:1px solid var(--line);font-size:13px;position:relative}
.t .fdur{position:absolute;left:1px;width:3.5px;border-radius:2px;top:50%;transform:translateY(-50%)}
.t .fmat{position:absolute;left:7px;top:5px;bottom:5px;width:2.5px;border-radius:2px}
.t.cam{padding-left:16px}
.t .sub .tim{color:var(--hint)}
.t:last-child{border-bottom:none}
.t .st{width:17px;height:17px;border-radius:5px;border:1.6px solid var(--line2);background:#fff;flex:none;display:flex;align-items:center;justify-content:center;font-size:11px;color:#fff;padding:0;line-height:1}
.t .st.proc{background:var(--ambbg);border-color:var(--amb);color:var(--ambtx);font-size:9px}
.t .st.hecho{background:var(--grn);border-color:var(--grn)}
.t .tt{flex:1;min-width:0;cursor:pointer}
.t .tt .nm{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.t.hecho .nm{text-decoration:line-through;color:var(--hint)}
.t .sub{font-size:10.5px;color:var(--hint);display:block}
.t .sub{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:2px}
.t .sub .tipo{font-size:9.5px;padding:1px 7px;border-radius:9px;font-weight:500;white-space:nowrap}
.t .sub .tim{font-size:10px;font-weight:500;white-space:nowrap}
.t .sub .dsc{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.t.hecho .sub{opacity:.45}
.t .lb{font-size:10px;padding:2px 8px;border-radius:10px;white-space:nowrap;flex:none}
.wkh{display:flex;align-items:baseline;gap:8px;margin:14px -14px 4px;padding:5px 14px;background:var(--accbg);border-top:1px solid var(--line)}
.wkh:first-of-type{margin-top:4px}
.wkh.urge{background:var(--danbg)}
.wkh.urge span:first-child,.wkh.urge .wkn{color:var(--dantx)}
.wkh span:first-child{font-size:11.5px;font-weight:600;color:var(--acctx);letter-spacing:.02em}
.wkh .wkn{font-size:10px;color:var(--acctx);opacity:.7;margin-left:auto;white-space:nowrap}
.carga{margin-bottom:11px;cursor:pointer}
.carga .cn{display:flex;align-items:center;gap:8px;font-size:12.5px;margin-bottom:4px}
.carga .cq{font-size:12.5px;color:var(--mut);font-weight:600}
.carga .cm{font-size:10px;color:var(--hint);margin-top:3px}
details.more{border-top:1px solid var(--line);margin-top:12px;padding-top:9px}
details.more summary{font-size:11.5px;color:var(--mut);cursor:pointer;list-style:none;padding:3px 0}
details.more summary::-webkit-details-marker{display:none}
details.more summary:before{content:'▸ ';color:var(--acc)}
details.more[open] summary:before{content:'▾ '}
.t .dt{font-size:10.5px;color:var(--mut);white-space:nowrap;flex:none;min-width:52px;text-align:right}
.t .dt.late{color:var(--dan);font-weight:600}
.t .dt.soon{color:var(--acctx);font-weight:600}
.t .dt .hra{display:block;font-size:9.5px;font-weight:400;color:var(--hint);letter-spacing:.02em}
.t .ic{font-size:11px;color:var(--hint);flex:none}
.add{font-size:12px;color:var(--mut);border:1px dashed var(--line2);border-radius:10px;padding:6px 12px;background:transparent;width:100%;margin-top:8px}
.add:hover{border-color:var(--acc);color:var(--acctx)}

/* ---------- gantt / ruta ---------- */
.gan{display:flex;align-items:center;gap:8px;margin-bottom:7px;font-size:11.5px}
.gan .gl{width:96px;flex:none;color:var(--mut);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gan .gt{flex:1;height:15px;background:#EFEAE2;border-radius:5px;position:relative;overflow:hidden;cursor:pointer}
.gan .gf{position:absolute;top:0;bottom:0;border-radius:5px;opacity:.35}
.gan .gp{position:absolute;top:0;bottom:0;border-radius:5px}
.gan .gnow{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--dan);z-index:3}
.gan .gv{width:42px;flex:none;text-align:right;font-size:10.5px;color:var(--mut)}
.ganwrap{position:relative}
.ganaxis{display:flex;margin-left:104px;margin-right:50px;font-size:9.5px;color:var(--hint);justify-content:space-between;margin-bottom:5px}
.etapa{border:1px solid var(--line);border-radius:11px;padding:10px 12px;margin-bottom:10px}
.etapa.late{border-color:var(--dan);background:var(--danbg)}
.etapa.risk{border-color:var(--amb);background:var(--ambbg)}
.etapa h4{font-size:13.5px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.chip{font-size:10px;padding:2px 8px;border-radius:10px;font-weight:400}
.chip.late{background:var(--dan);color:#fff}
.chip.risk{background:var(--amb);color:#fff}
.chip.ok{background:var(--grn);color:#fff}
.chip.n{background:#EFEAE2;color:#5A5348}

/* ---------- calendario ---------- */
.calhead{display:flex;align-items:center;gap:12px;margin-bottom:11px;flex-wrap:wrap}
.calhead .nav{font-size:17px;color:var(--acc);background:none;border:none;padding:0 5px;line-height:1}
.calhead .mo{font-size:15px;font-weight:600;min-width:132px}
.cal{display:grid;grid-template-columns:30px repeat(7,minmax(0,1fr));gap:5px}
.wcol{display:flex;align-items:center;justify-content:center;font-size:10.5px;font-weight:600;color:var(--hint);background:var(--soft);border:1px solid var(--line);border-radius:9px}
.wcol.now{background:var(--accbg);color:var(--acctx);border-color:var(--acc)}
.cal .cell.asueto{background:repeating-linear-gradient(45deg,var(--soft),var(--soft) 6px,#F1ECE4 6px,#F1ECE4 12px)}
.clsrow{display:flex;gap:2px;margin-bottom:3px}
.clsbar{flex:1;height:4px;border-radius:2px}
.clsdot{width:9px;height:9px;border-radius:50%;flex:none}
.diahd{display:flex;align-items:center;gap:9px;margin-bottom:2px}
.diahd b{font-size:16px;font-weight:600}
.diahd .s{font-size:10.5px;background:var(--accbg);color:var(--acctx);padding:1px 9px;border-radius:11px}
.diahd .diax{margin-left:auto;background:none;border:none;font-size:16px;color:var(--hint);padding:0 2px}
.diars{font-size:11.5px;color:var(--mut);margin-bottom:10px}
.dianav{display:flex;gap:6px;margin-bottom:4px}
.dianav button{font-size:11px;padding:4px 11px;border-radius:11px;border:1px solid var(--line2);background:#fff;color:var(--mut);flex:1}
.dianav button:hover{border-color:var(--acc);color:var(--acctx)}
.diaband{margin:13px -17px 5px;padding:5px 17px;background:var(--accbg);color:var(--acctx);font-size:10.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase}
.cal .dow{font-size:10px;color:var(--hint);text-align:center;text-transform:uppercase;letter-spacing:.05em;padding-bottom:2px}
.cal .cell{background:var(--card);border:1px solid var(--line);border-radius:9px;min-height:82px;padding:5px 5px 4px;font-size:11px;cursor:pointer;overflow:hidden;min-width:0}
.cal .cell.out{background:transparent;border-color:transparent;opacity:.4}
.cal .cell.hoy{border-color:var(--acc);border-width:1.5px}
.cal .cell .dn{font-size:10.5px;color:var(--mut);margin-bottom:3px;display:flex;justify-content:space-between}
.cal .cell.hoy .dn{color:var(--acctx);font-weight:600}
.cal .cell .wk{font-size:9px;color:var(--hint)}
.tk{font-size:10px;padding:2px 5px;border-radius:5px;margin-bottom:2px;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tk.hecho{opacity:.45;text-decoration:line-through}
.filtros{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:11px}
.fpill{font-size:11px;padding:3px 11px;border-radius:12px;border:1px solid var(--line2);background:#fff;color:var(--mut)}
.fpill.on{border-color:transparent}
.fpill.todas{font-weight:600;border-color:var(--line2)}
.fpill.todas.on{background:var(--txt);color:#fff;border-color:var(--txt)}

/* ---------- clases ---------- */
.clsgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.ccard{background:var(--card);border:1px solid var(--line);border-radius:13px;overflow:hidden;display:flex;flex-direction:column;min-width:0}
.cbn{padding:10px 12px 9px;color:#fff}
.cbn .cnm{font-size:14.5px;font-weight:600;line-height:1.2}
.cbn .cpf{font-size:10.5px;opacity:.9;margin-top:2px}
.cbn .chr{font-size:10px;opacity:.8;margin-top:3px}
.cbd{padding:10px 12px;flex:1;min-height:66px}
.cdue{font-size:10px;padding:2px 8px;border-radius:10px;display:inline-block;margin-bottom:5px;font-weight:500}
.ctx{font-size:12.5px;line-height:1.3;cursor:pointer}
.ctx:hover{color:var(--acctx)}
.cmt{font-size:10px;color:var(--hint);margin-top:5px}
.cft{display:flex;gap:10px;flex-wrap:wrap;border-top:1px solid var(--line);padding:8px 12px;font-size:11px;align-items:center}
.cft a{color:var(--blutx);text-decoration:none}
.cft a:hover{text-decoration:underline}
.cft .cadd{margin-left:auto;color:var(--acctx);cursor:pointer;font-weight:500;white-space:nowrap}
.cft .cfalta{color:var(--hint);cursor:pointer}
.cft .cfalta:hover{color:var(--acctx)}
.cext{display:flex;gap:6px;flex-wrap:wrap;padding:0 12px 10px}
.cchip{font-size:10px;padding:3px 9px;border-radius:11px;text-decoration:none;white-space:nowrap}

/* ---------- horario semanal ---------- */
.hor{padding-bottom:11px}
.hnav{display:flex;align-items:center;gap:7px;margin:2px 0 9px;flex-wrap:wrap}
.hnav .b{font-size:11px;border:1px solid var(--line2);background:#fff;color:var(--mut);border-radius:9px;padding:3px 10px}
.hnav .b:hover{border-color:var(--acc);color:var(--acctx)}
.hnav .wk{font-size:12.5px;font-weight:600}
.hnav .rg{font-size:10.5px;color:var(--hint)}
.hnav .sp{margin-left:auto;font-size:10px;color:var(--ambtx);background:var(--ambbg);padding:2px 9px;border-radius:10px}
.hor .gr{display:grid;grid-template-columns:19px repeat(6,minmax(0,1fr));gap:2px}
.hor .dh{font-size:9px;color:var(--mut);text-align:center;font-weight:600;padding-bottom:2px;line-height:1.15}
.hor .dh small{display:block;font-weight:400;color:var(--hint);font-size:8.5px}
.hor .dh.hoy{color:var(--acctx)}
.hor .hrs{position:relative;height:var(--alto)}
.hor .hrs span{position:absolute;right:3px;font-size:8.5px;color:var(--hint);transform:translateY(-4px)}
.hor .col{position:relative;background:var(--card);border:1px solid var(--line);border-radius:7px;height:var(--alto);min-width:0}
.hor .col.hoy{border-color:var(--acc);border-width:1.5px;border-style:dashed}
.hor .col.asu{background:repeating-linear-gradient(45deg,var(--soft),var(--soft) 6px,#F1ECE4 6px,#F1ECE4 12px)}
.hor .asut{position:absolute;bottom:3px;left:0;right:0;text-align:center;font-size:8px;color:var(--hint)}
.hor .ln{position:absolute;left:0;right:0;height:1px;background:#F2EDE5}
.hor .bl{position:absolute;left:1px;right:1px;border:none;border-left:2.5px solid;border-radius:0 4px 4px 0;padding:2px 3px;overflow:hidden;text-align:left;cursor:pointer;background:#fff}
.hor .bl .n{font-size:8.5px;font-weight:600;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;line-height:1.15}
.hor .bl .hq{font-size:7.5px;opacity:.7;display:block;line-height:1.1}
.hor .bl.canc{background:repeating-linear-gradient(45deg,#F2EFE9,#F2EFE9 4px,#E7E1D8 4px,#E7E1D8 8px);border-left-color:#B4B2A9;color:#8A8175}
.hor .bl.canc .n{text-decoration:line-through}
.hleg{font-size:10px;color:var(--hint);margin-top:8px}
.cancbox{background:var(--ambbg);border:1px solid var(--amb);border-radius:11px;padding:10px 11px;margin-top:12px}
.cancbox .ct2{font-size:12px;font-weight:600;color:var(--ambtx)}
.cancbox .cmot{font-size:11.5px;color:var(--ambtx);margin-top:3px}

/* ---------- faltas ---------- */
.resum{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;text-align:center}
.resum div{background:var(--soft);border-radius:10px;padding:9px 4px}
.resum b{display:block;font-size:22px;font-weight:600;line-height:1.1}
.resum span{font-size:10px;color:var(--mut)}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.fcard{background:var(--card);border:1px solid var(--line);border-radius:13px;overflow:hidden;cursor:pointer}
.fcard.ojo{border-color:var(--amb)}
.fcard.mal{border-color:var(--dan);border-width:1.5px}
.fcard .fbn{padding:7px 11px;color:#fff;font-size:12.5px;font-weight:600}
.fcard .fbd{padding:10px 11px 12px}
.fcard .fnum{display:flex;align-items:baseline;gap:6px}
.fcard .fnum b{font-size:34px;font-weight:600;line-height:1}
.fcard .fnum span{font-size:11px;color:var(--mut)}
.fcard .fet{font-size:11px;margin-top:2px;color:var(--grntx)}
.fcard.ojo .fet{color:var(--ambtx)}
.fcard.mal .fet{color:var(--dantx)}

function splitTar(list){

function mergeById(local, remote){
  var map={}, i;
  for(i=0;i<local.length;i++) map[local[i].id]=local[i];
  for(i=0;i<remote.length;i++){
    var r=remote[i], e=map[r.id];
    if(!e){ map[r.id]=r; continue; }
    if((r.ts||0) > (e.ts||0)) map[r.id]=r;
  }
  var out=[]; for(var k in map) if(map.hasOwnProperty(k)) out.push(map[k]);
  return out;
}

/* ============ cálculo de calificaciones ============ */
function notaP9(){
  var totalPeso=0, acum=0, capturados=0, totalRubros=0;
  for(var i=0;i<RUBRICA.length;i++){
    var C=RUBRICA[i], sw=0, sv=0;
    for(var j=0;j<C.rubros.length;j++){
      var R=C.rubros[j]; totalRubros++;
      var v=valorRubro(R.id);
      if(v!=null){ sw+=R.w; sv+=v*R.w; capturados++; }
    }
    if(sw>0){ totalPeso+=C.peso; acum+=(sv/sw)*C.peso; }
  }
  return { nota: totalPeso>0 ? acum/totalPeso : null, cobertura: totalPeso, capturados:capturados, total:totalRubros };
}
function valorRubro(rid){
  if(D.cal[rid]!=null && D.cal[rid]!=='') return +D.cal[rid];
  var vs=[];
  for(var i=0;i<D.tar.length;i++){ var T=D.tar[i]; if(T.comp===rid && T.cal!=null && T.cal!=='') vs.push(+T.cal); }
  if(!vs.length) return null;
  var s=0; for(var k=0;k<vs.length;k++) s+=vs[k];
  return s/vs.length;
}
/* si una materia tiene rúbrica propia, su calificación sale de ahí */
function notaMateria(mid){
  var M=mat(mid);
  if(!M.rubros || !M.rubros.length) return null;
  var sw=0, sv=0, cap=0;
  for(var i=0;i<M.rubros.length;i++){
    var R=M.rubros[i];
    if(R.v!=null && R.v!==''){ sw+=R.w; sv+=(+R.v)*R.w; cap++; }
  }
  return { nota: sw>0 ? sv/sw : null, cobertura: sw, capturados:cap, total:M.rubros.length,
           pesoTotal: M.rubros.reduce(function(a,b){ return a+(+b.w||0); },0) };
}
function notaFinal(){
  var sw=0, sv=0, np=notaP9();
  for(var i=0;i<D.fin.length;i++){
    var F=D.fin[i], v=null;
    if(F.auto) v = np.nota;
    else {
      var nm=notaMateria(F.id);
      if(nm && nm.nota!=null) v=nm.nota;
      else if(F.v!=null && F.v!=='') v=+F.v;
    }
    if(v!=null){ sw+=F.w; sv+=v*F.w; }
  }
  return { nota: sw>0 ? sv/sw : null, cobertura: sw };
}
function n1(x){ return x==null?'—':(Math.round(x*10)/10).toFixed(1); }

    for(var j=0;j<ts.length;j++){
      var T=ts[j]; if(T.st===2) continue;
      var dd=difDias(T.f);
      if(dd!=null && dd<0){ var sem=Math.floor(-dd/7); if(sem>atrasoMax) atrasoMax=sem; }
    }
    var propio = atrasoMax;
    var heredado = arrastre;
    var estado='ok';
    if(propio>=2) estado='late';
    else if(propio>=1 || heredado>=2) estado='risk';
    if(ts.length && hechas===ts.length) estado='done';
    if(propio>arrastre) arrastre=propio;
    out.push({ e:E, tareas:ts, hechas:hechas, atraso:propio, arrastre:heredado, estado:estado,
               pct: ts.length? Math.round(hechas/ts.length*100):0 });
  }
  return out;
}

    var a=parseD(T.f), b=parseD(diaCtx), faltan=Math.round((a-b)/MS);

      +'</span></span>'
      + (ocultaMateria?'':'<span class="lb" style="background:'+M.bg+';color:'+M.fg+'">'+esc(M.nombre)+'</span>')
      +'<span class="dt" style="color:'+U.fg+'"><b>'+(faltan===1?'queda 1 día':'quedan '+faltan+' días')+'</b>'
      +'<small>límite '+corta(T.f)+'</small></span>'
      +'</div>';
  }
  var hr = T.hora ? '<small class="hra">'+esc(T.hora)+'</small>' : '';
  if(T.st!==2 && dd!=null){
    if(dd<0){ cls='late'; txt = -dd===1?'ayer':(-dd)+' días tarde'; }
    else if(dd===0){ cls='soon'; txt='hoy'; }
    else if(dd===1){ cls='soon'; txt='mañana'; }

  }
  if(T.fpre && T.st!==2){
    var dp=difDias(T.fpre), pt=corta(T.fpre);

    txt = '<span class="pre">'+pt+'</span> → <b>'+txt+'</b>';

  if(TM) sub += '<span class="tim">'+TM.n+'</span>';

  return '<div class="t '+(T.st===2?'hecho':'')+'"'+tint+'>'
    + (TM && T.st!==2 ? '<span class="fdur" style="height:'+TM.alto+'px;background:'+TM.c+'"></span>' : '')
    +'<button class="st '+stc+'" data-st="'+T.id+'" aria-label="Cambiar estado">'+sti+'</button>'
    +'<span class="tt" data-ed="'+T.id+'"><span class="nm">'+esc(T.t)+'</span><span class="sub">'+sub+'</span></span>'
    + (ocultaMateria?'':'<span class="lb" style="background:'+M.bg+';color:'+M.fg+'">'+esc(M.nombre)+'</span>')

/* ---------- clases generadas del horario ---------- */
var ASUETOS={'2026-09-16':'Independencia','2026-10-12':'Asueto','2026-11-02':'Día de muertos','2026-11-16':'Asueto'};
var DIAS_L=['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
function horarioTxt(M){
  if(!M.dias || !M.dias.length) return M.horario||'';
  var ds=M.dias.slice().sort(function(a,b){return a-b;}).map(function(x){ return DIAS_L[x]; });
  var txt = ds.length===1 ? ds[0] : ds.slice(0,-1).join(', ')+' y '+ds[ds.length-1];
  txt = txt.charAt(0).toUpperCase()+txt.slice(1);
  if(M.hini) txt += ' '+M.hini+(M.hfin?'–'+M.hfin:'');
  return txt;
}
function cancelKey(mid,s){ return mid+'|'+s; }
function cancelada(mid,s){
  for(var i=0;i<D.canc.length;i++) if(D.canc[i].id===cancelKey(mid,s) && !D.canc[i].off) return D.canc[i];
  return null;
}
/* todas las sesiones de ese día, incluyendo las canceladas (para el horario) */
function sesionesDe(s){
  if(!semanaDeFecha(s)) return [];
  var d=parseD(s), dow=d.getDay(), out=[];
  for(var i=0;i<D.mat.length;i++){
    var M=D.mat[i];
    if(M.clase && M.dias && M.dias.indexOf(dow)>=0) out.push(M);
  }
  out.sort(function(a,b){ return (a.hini||'').localeCompare(b.hini||''); });
  return out;
}
/* las que sí se dan: sin asuetos y sin canceladas (para calendario y vista de día) */
function clasesDe(s){
  if(ASUETOS[s]) return [];
  return sesionesDe(s).filter(function(M){ return !cancelada(M.id,s); });
}
function abrev(M){
  if(M.abr) return M.abr;
  var n=(M.nombre||'').trim();
  if(n.length<=8) return n;
  var w=n.split(/\s+/)[0];
  return w.length<=8 ? w : w.slice(0,7);
}
function minutos(h){ if(!h) return null; var p=h.split(':'); return (+p[0])*60+(+p[1]||0); }
/* ¿alguna entrega que alimenta a esta ya se pasó de fecha sin entregarse? */
function insumoAtrasado(T){
  for(var i=0;i<D.tar.length;i++){
    var X=D.tar[i];
    if(X.alim!==T.id || X.st===2) continue;
    var dd=difDias(X.f);
    if(dd!=null && dd<0) return X;
  }
  return null;
}

/* escala de urgencia para el camino hacia la fecha límite */
var URG=[
  {d:5, bg:'#E4EDE8', fg:'#3A5E53', bd:'#5F8A7D'},
  {d:4, bg:'#EAEFE3', fg:'#42522F', bd:'#6B7F5A'},
  {d:3, bg:'#F3EDDF', fg:'#6E5522', bd:'#A98545'},
  {d:2, bg:'#F7E7DE', fg:'#8A4529', bd:'#C97B5A'},
  {d:1, bg:'#F8E3DE', fg:'#8C3325', bd:'#B5503F'}
];
function urgencia(fLim, sDia){
  var a=parseD(fLim), b=parseD(sDia);
  var faltan = (a&&b) ? Math.round((a-b)/MS) : 9;
  for(var i=0;i<URG.length;i++) if(faltan<=URG[i].d && faltan>=URG[i].d) return URG[i];
  if(faltan>=5) return URG[0];
  if(faltan<=1) return URG[4];
  return URG[2];
}
function rangoSemana(n){
  var a=SEMANAS[n-1]; if(!a) return '';
  var b=new Date(a); b.setDate(b.getDate()+6);
  var mA=MESC[a.getMonth()], mB=MESC[b.getMonth()];
  return a.getDate()+(mA!==mB?' '+mA:'')+'–'+b.getDate()+' '+mB;
}

/* ============ control de faltas ============ */
function faltKey(mid,f){ return 'F'+mid+'|'+f; }
function falta(mid,f){
  for(var i=0;i<D.falt.length;i++) if(D.falt[i].id===faltKey(mid,f) && !D.falt[i].off) return D.falt[i];
  return null;
}
/* total teórico de clases del semestre: las canceladas por el profe NO lo reducen */
function clasesTotales(mid){
  var M=mat(mid); if(!M.clase || !M.dias || !M.dias.length) return 0;
  var n=0;
  for(var w=0; w<SEMANAS.length; w++){
    for(var d=0; d<7; d++){
      var dt=new Date(SEMANAS[w]); dt.setDate(dt.getDate()+d);
      if(ASUETOS[fmtD(dt)]) continue;
      if(M.dias.indexOf(dt.getDay())>=0) n++;
    }
  }
  return n;
}
function pctFaltas(){ return (D.gen && D.gen.pct!=null) ? +D.gen.pct : 0.10; }
function maxFaltas(mid){
  var M=mat(mid);
  if(M.maxF!=null && M.maxF!=='') return +M.maxF;
  return Math.floor(clasesTotales(mid)*pctFaltas());
}
function faltasDe(mid){
  var hoyS=fmtD(hoy()), reales=0, proy=0, lista=[];
  for(var i=0;i<D.falt.length;i++){
    var F=D.falt[i];
    if(F.m!==mid || F.off) continue;
    if(ASUETOS[F.f] || cancelada(mid,F.f)) continue;   /* clase cancelada nunca cuenta */
    lista.push(F);
    if(F.f<=hoyS) reales++; else proy++;
  }
  lista.sort(function(a,b){ return a.f.localeCompare(b.f); });
  var max=maxFaltas(mid), usadas=reales+proy;
  var rest=max-usadas;
  return { reales:reales, proy:proy, usadas:usadas, max:max, rest:rest, lista:lista,
           total:clasesTotales(mid),
           estado: rest<=0 ? 'mal' : (rest===1 ? 'ojo' : 'bien'),
           etiqueta: rest<=0 ? 'Al límite' : (rest===1 ? 'Cuidado, es la última' : 'Vas bien') };
}

/* ---------- horario semanal ---------- */
var HSEM=null;
function vHorario(){
  var L = HSEM ? parseD(HSEM) : lunesDe(hoy());
  var hoyS=fmtD(hoy()), h='';
  var wn=semanaDeFecha(fmtD(L));

  /* rango de horas: se calcula solo con lo que tengas capturado */
  var min=1440, max=0, hay=false;
  for(var i=0;i<D.mat.length;i++){
    var M=D.mat[i]; if(!M.clase||!M.dias||!M.dias.length) continue;
    var a=minutos(M.hini), b=minutos(M.hfin);
    if(a==null) continue;
    hay=true; if(a<min) min=a; if((b||a+60)>max) max=b||a+60;
  }
  if(!hay) return '<div class="box"><span class="bh a">Mi semana</span><div class="empty">Captura los días y horas de tus clases en la pestaña Clases y aquí aparece tu horario.</div></div>';
  min=Math.floor(min/60)*60; max=Math.ceil(max/60)*60;
  var horas=(max-min)/60, HH=22, alto=horas*HH;

  var fin=new Date(L); fin.setDate(fin.getDate()+5);
  var cancel=0;
  for(var q=0;q<6;q++){ var dq=new Date(L); dq.setDate(dq.getDate()+q);
    var sq=fmtD(dq), sesq=sesionesDe(sq);
    for(var z=0;z<sesq.length;z++) if(cancelada(sesq[z].id,sq)) cancel++;
  }

  h+='<div class="box hor"><span class="bh a">Mi semana</span>';
  h+='<div class="hnav">'
    +'<button class="b" data-hs="-7">‹</button>'
    +'<span class="wk">'+(wn?'S'+wn:'—')+'</span>'
    +'<span class="rg">'+L.getDate()+'–'+fin.getDate()+' '+MESC[fin.getMonth()]+'</span>'
    +'<button class="b" data-hs="7">›</button>'
    + (HSEM? '<button class="b" data-hs="0">hoy</button>':'')
    + (cancel? '<span class="sp">'+cancel+' sin clase</span>':'')
    +'</div>';

  h+='<div class="gr" style="--alto:'+alto+'px">';
  h+='<div></div>';
  var DW=['Lun','Mar','Mié','Jue','Vie','Sáb'];
  for(var w=0;w<6;w++){
    var dw=new Date(L); dw.setDate(dw.getDate()+w);
    var sw=fmtD(dw);
    h+='<div class="dh '+(sw===hoyS?'hoy':'')+'">'+DW[w]+'<small>'+dw.getDate()+'</small></div>';
  }
  h+='<div class="hrs">';
  for(var t=0;t<=horas;t++) h+='<span style="top:'+(t*HH)+'px">'+((min/60)+t)+'</span>';
  h+='</div>';

  for(var d2=0;d2<6;d2++){
    var dd=new Date(L); dd.setDate(dd.getDate()+d2);
    var s=fmtD(dd), esHoy=(s===hoyS), asueto=ASUETOS[s];
    h+='<div class="col '+(esHoy?'hoy':'')+' '+(asueto?'asu':'')+'">';
    for(var t2=1;t2<horas;t2++) h+='<div class="ln" style="top:'+(t2*HH)+'px"></div>';
    if(asueto) h+='<div class="asut">'+esc(asueto)+'</div>';
    var ses=sesionesDe(s);
    for(var k=0;k<ses.length;k++){
      var MS2=ses[k], ini=minutos(MS2.hini), f2=minutos(MS2.hfin)||ini+60;
      var top=(ini-min)/60*HH, alt=Math.max(18,(f2-ini)/60*HH-2);
      var C=cancelada(MS2.id,s), off=(C||asueto), FA=falta(MS2.id,s);
      var clsF = FA ? (s>fmtD(hoy()) ? ' faltp' : ' falt') : '';
      h+='<button class="bl'+(off?' canc':clsF)+'" data-clase="'+MS2.id+'|'+s+'"'
        +' style="top:'+top+'px;height:'+alt+'px;'+(off?'':'background:'+MS2.bg+';border-left-color:'+MS2.c+';color:'+MS2.fg)+'">'
        +'<span class="n">'+esc(abrev(MS2))+'</span>'
        + (alt>=32 ? '<span class="hq">'+esc(off?'no hay':(FA?(s>fmtD(hoy())?'faltaré':'falté'):MS2.hini))+'</span>' : '')
        +'</button>';
    }
    h+='</div>';
  }
  h+='</div>';
  h+='<div class="hleg">Toca una clase para marcar que no se dará.</div>';
  h+='</div>';
  return h;
}

function vInicio(){
  var h='';
  var atrasadas = D.tar.filter(function(T){ var dd=difDias(T.f); return T.st!==2 && dd!=null && dd<0; });
  var hoyT = D.tar.filter(function(T){ return T.st!==2 && difDias(T.f)===0; });

  });
  var L0=lunesDe(hoy()), finSem=new Date(L0); finSem.setDate(finSem.getDate()+6);

  h+='<div class="box"><span class="bh b">Carga por materia</span>';

    var atr=ts.filter(function(T){ var dd2=difDias(T.f); return dd2!=null && dd2<0; }).length;
    var hrs=0; for(var q2=0;q2<ts.length;q2++){ var tm2=tiempo(ts[q2].dur); if(tm2) hrs+=tm2.h; }
    var hechas=D.tar.filter(function(T){ return T.m===M.id && T.st===2; }).length;
    totalPend+=ts.length;
    return {M:M, n:ts.length, atr:atr, hrs:hrs, hechas:hechas};
  });
  var maxN=1; for(var c1=0;c1<cargas.length;c1++) if(cargas[c1].n>maxN) maxN=cargas[c1].n;
  for(var c2=0;c2<cargas.length;c2++){

    h+='<div class="carga" data-carga="'+C.M.id+'">'
      +'<div class="cn"><span class="dotc" style="background:'+C.M.c+'"></span>'
      +'<span style="flex:1">'+esc(C.M.nombre)+'</span>'
      +'<span class="cq">'+C.n+'</span></div>'
      +'<div class="bar"><i style="width:'+Math.round(C.n/maxN*100)+'%;background:'+C.M.c+'"></i></div>'
      +'<div class="cm">'+(C.atr?'<b style="color:var(--dan)">'+C.atr+' atrasado'+(C.atr>1?'s':'')+'</b> · ':'')
      + (C.hrs? Math.round(C.hrs)+' h estimadas' : 'sin tiempo estimado')
      + (C.hechas? ' · '+C.hechas+' listos':'') +'</div></div>';
  }
  h+='<div class="empty" style="margin-top:2px">'+totalPend+' pendientes abiertos en total</div></div>';

  h+='<div class="box"><span class="bh p">Ruta del semestre</span><div class="ganwrap">'+ganttHTML(etp)+'</div>'
    +'<div class="empty" style="margin-top:6px">La línea vertical es hoy · toca una barra para ver sus entregables</div></div>';

  h+='</div></div>';
  return h;
}

  var clases=matsOrd().filter(function(M){ return M.clase && M.dias && M.dias.length; });

  }

  if(!clases.length) return '<div class="box"><span class="bh n">Faltas</span><div class="empty">Captura los días de tus clases en la pestaña Clases y aquí aparece el control de faltas.</div></div>';

  h+='<div class="fgrid">';

      +'<i class="p" style="width:'+pP+'%;border-color:'+M.c+'"></i></div>'

/* ---------- clases · cuadrícula tipo Classroom ---------- */
function ligasClassroom(M){
  var u=(M.classroom||'').trim();
  if(!u) return null;
  var m=u.match(/classroom\.google\.com\/(?:u\/(\d+)\/)?c\/([A-Za-z0-9_-]+)/);
  if(m){
    var cuenta = m[1]!==undefined ? 'u/'+m[1]+'/' : '';
    return { tablon:'https://classroom.google.com/'+cuenta+'c/'+m[2],
             trabajos:'https://classroom.google.com/'+cuenta+'w/'+m[2]+'/t/all' };
  }
  return { tablon:u, trabajos:'' };
}

/* arrastre para reordenar, funciona con dedo y con mouse */
var DRAG=null;
function initDrag(){
  var cont=document.getElementById('bloques'); if(!cont) return;
  cont.addEventListener('pointerdown', function(ev){
    var g = ev.target.closest ? ev.target.closest('[data-grip]') : null;
    if(!g) return;
    var fila = g.closest('.blk'); if(!fila) return;
    ev.preventDefault();
    DRAG={cont:cont, fila:fila, movido:false};
    fila.classList.add('arrastrando');
    document.body.style.userSelect='none';
    document.addEventListener('pointermove', dragMove, {passive:false});
    document.addEventListener('pointerup', dragEnd);
    document.addEventListener('pointercancel', dragEnd);
  });
}
function dragMove(e){
  if(!DRAG) return;
  if(e.cancelable) e.preventDefault();
  DRAG.movido=true;
  var cont=DRAG.cont, fila=DRAG.fila, y=e.clientY, destino=null;
  var filas=cont.querySelectorAll('.blk');
  for(var i=0;i<filas.length;i++){
    var f=filas[i]; if(f===fila) continue;
    var r=f.getBoundingClientRect();
    if(y < r.top + r.height/2){ destino=f; break; }
  }
  if(destino){ if(destino!==fila.nextSibling || fila.parentNode!==cont) cont.insertBefore(fila,destino); }
  else if(cont.lastChild!==fila) cont.appendChild(fila);
}
function dragEnd(){
  if(!DRAG) return;
  var cont=DRAG.cont, fila=DRAG.fila, movido=DRAG.movido;
  fila.classList.remove('arrastrando');
  document.body.style.userSelect='';
  document.removeEventListener('pointermove', dragMove, {passive:false});
  document.removeEventListener('pointerup', dragEnd);
  document.removeEventListener('pointercancel', dragEnd);
  DRAG=null;
  if(!movido) return;
  var filas=cont.querySelectorAll('.blk'), cambio=false;
  for(var k=0;k<filas.length;k++){
    var M=mat(filas[k].getAttribute('data-blk'));
    if(M && M.ord!==k+1){ M.ord=k+1; stamp(M); cambio=true; }
  }
  if(cambio){ save(); render(); toast('Orden guardado'); }
}

  var C=cancelada(mid,s), L=ligasClassroom(M), asueto=ASUETOS[s];
  var h='<h3>'+esc(M.nombre)+'</h3>';
  h+='<div class="diars" style="margin-bottom:11px">'+DIAS_L[d.getDay()].charAt(0).toUpperCase()+DIAS_L[d.getDay()].slice(1)+' '+d.getDate()+' de '+MESES[d.getMonth()]+'</div>';

  if(asueto) h+='<div class="alert warn">Asueto: '+esc(asueto)+'. Ese día no hay clases.</div>';

  var datos=[];
  if(M.hini) datos.push(['Horario', M.hini+(M.hfin?'–'+M.hfin:'')+(M.aula?' · '+esc(M.aula):'')]);
  if(M.prof) datos.push(['Profesor', esc(M.prof)]);
  if(M.nrc) datos.push(['NRC', esc(M.nrc)]);
  for(var i=0;i<datos.length;i++)
    h+='<div class="rub" style="padding:5px 0"><span class="rw" style="width:60px;flex:none">'+datos[i][0]+'</span><span class="rn" style="font-size:12.5px">'+datos[i][1]+'</span></div>';

  if(!asueto){
    var FA=falta(mid,s), futuro=(s>fmtD(hoy()));
    if(!C){
      if(FA){
        h+='<div class="faltabox"><div class="ct2">'+(futuro?'Planeaste faltar a esta clase':'Faltaste a esta clase')+'</div>'
          + (FA.motivo? '<div class="cmot">'+esc(FA.motivo)+'</div>':'')
          +'<button class="add" style="margin-top:7px" data-quitafalta="'+mid+'|'+s+'">Quitar la falta</button></div>';
      } else {
        var FR=faltasDe(mid);
        h+='<div class="fld" style="margin-top:12px"><label>Motivo · opcional</label>'
          +'<input id="fMot" placeholder="Cita, enferma, se me hizo tarde…"></div>'
          +'<button class="add" data-marcafalta="'+mid+'|'+s+'" style="border-color:var(--dan);color:var(--dantx)">'
          +(futuro?'Planear que voy a faltar':'Marcar que falté')+'</button>'
          +'<div class="empty" style="margin-top:4px">Te quedan '+Math.max(0,FR.rest)+' de '+FR.max+' en esta materia.</div>';
      }
    }
    if(C){
      h+='<div class="cancbox"><div class="ct2">No hay clase este día</div>'
        + (C.motivo? '<div class="cmot">'+esc(C.motivo)+'</div>' : '<div class="cmot" style="color:var(--hint)">sin motivo anotado</div>')
        +'<button class="add" style="margin-top:7px" data-descancel="'+mid+'|'+s+'">Sí hay clase, deshacer</button></div>';
    } else {
      h+='<div class="fld" style="margin-top:12px"><label>Motivo · opcional</label>'
        +'<input id="cMot" placeholder="El profe en junta, puente, congreso…"></div>'
        +'<button class="add" data-cancelar="'+mid+'|'+s+'" style="border-color:var(--amb);color:var(--ambtx)">Marcar que no hay clase este día</button>';
    }
  }

  h+='<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px">';
  if(L) h+='<a class="mini" style="text-decoration:none;padding:7px 12px" href="'+esc(L.tablon)+'" target="_blank" rel="noopener">Classroom ↗</a>';
  h+='<button class="mini" style="padding:7px 12px" data-newmat="'+mid+'">+ tarea</button>';
  h+='<button class="mini" style="padding:7px 12px" data-mat="'+mid+'">Editar materia</button>';
  h+='</div>';

  h+='<div class="acts"><button data-cancel="1">Cerrar</button></div>';
  abrir(h);
}

/* ============ sincronización en la nube ============ */
var SUPA_URL_DEF='';
var SUPA_KEY_DEF='';
var TABLA='escuela_sync';

var CFG = (function(){ try{ return JSON.parse(localStorage.getItem(K+'cfg'))||{}; }catch(e){ return {}; } })();
function cfgUrl(){
  var u=(((CFG&&CFG.url)||SUPA_URL_DEF||'')+'').trim().replace(/\s+/g,'');
  if(!u) return '';
  u=u.replace(/\/+$/,'').replace(/\/rest(\/v1)?$/i,'').replace(/\/+$/,'');
  if(!/^https?:\/\//i.test(u)) u='https://'+u;
  return u;
}
function cfgKey(){ return (CFG&&CFG.key)||SUPA_KEY_DEF||''; }
function cfgCode(){ return (CFG&&CFG.code)||''; }
function syncListo(){ return !!(cfgUrl() && cfgKey() && cfgCode()); }
function esLocal(){ return location.protocol==='file:'; }

var SYNC={ estado:'off', msg:'', ultimo:0, corriendo:false, pendiente:false };
function syncUI(){
  var e=document.getElementById('syncPill'); if(!e) return;
  var m={off:['·','sin sincronizar'], ok:['●','al día'], run:['◌','sincronizando'], err:['▲','sin conexión']};
  var x=m[SYNC.estado]||m.off;
  e.className='syncpill '+SYNC.estado;
  e.textContent=x[0]+' '+(SYNC.msg||x[1]);
}
function setSync(st,msg){ SYNC.estado=st; SYNC.msg=msg||''; syncUI(); }

function payload(){
  return { v:2, tar:allTar(), mat:allMat(), cal:D.cal, calts:D.calts, fin:D.fin, gen:D.gen, canc:D.canc, falt:D.falt };
}
function aplicarRemoto(R){
  if(!R || R.v!==2) return false;
  var antes=JSON.stringify(payload());
  splitTar(mergeById(allTar(), R.tar||[]));
  splitMat(mergeById(allMat(), R.mat||[]));
  var rc=R.cal||{}, rt=R.calts||{};
  for(var k in rc){ if(!rc.hasOwnProperty(k)) continue;
    if((rt[k]||0) > (D.calts[k]||0)){ D.cal[k]=rc[k]; D.calts[k]=rt[k]||0; }
  }
  for(var k2 in rt){ if(!rt.hasOwnProperty(k2)) continue;
    if(rc[k2]===undefined && (rt[k2]||0) > (D.calts[k2]||0)){ delete D.cal[k2]; D.calts[k2]=rt[k2]; }
  }
  D.fin = mergeById(D.fin, R.fin||[]);
  D.canc = mergeById(D.canc, R.canc||[]);
  D.falt = mergeById(D.falt, R.falt||[]);
  return JSON.stringify(payload())!==antes;
}

function heads(){
  return { 'apikey':cfgKey(), 'Authorization':'Bearer '+cfgKey(), 'Content-Type':'application/json' };
}
function ocupada(){
  var a=document.activeElement;
  if(a && (a.tagName==='INPUT'||a.tagName==='TEXTAREA'||a.tagName==='SELECT')) return true;
  return false;
}

function syncCiclo(forzar){
  if(!syncListo()){ setSync('off',''); return Promise.resolve(); }
  if(esLocal()){ setSync('err','solo en la web'); return Promise.resolve(); }
  if(SYNC.corriendo){ SYNC.pendiente=true; return Promise.resolve(); }
  if(!forzar && ocupada()){ SYNC.pendiente=true; return Promise.resolve(); }
  SYNC.corriendo=true; setSync('run','');
  var url=cfgUrl()+'/rest/v1/'+TABLA+'?code=eq.'+encodeURIComponent(cfgCode())+'&select=data';
  return fetch(url,{headers:heads()})
    .then(function(r){ if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); })
    .then(function(rows){
      var remoto = (rows && rows[0] && rows[0].data) ? rows[0].data : null;
      var cambio = remoto ? aplicarRemoto(remoto) : true;
      var mio = payload();
      var iguales = remoto && JSON.stringify(remoto)===JSON.stringify(mio);
      if(cambio){ guardaLocal(); render(); }
      if(iguales){ SYNC.corriendo=false; SYNC.ultimo=Date.now(); setSync('ok',''); return; }
      return fetch(cfgUrl()+'/rest/v1/'+TABLA,{
        method:'POST',
        headers:Object.assign({}, heads(), {'Prefer':'resolution=merge-duplicates,return=minimal'}),
        body:JSON.stringify({code:cfgCode(), data:mio, updated_at:new Date().toISOString()})
      }).then(function(r2){
        if(!r2.ok) throw new Error('HTTP '+r2.status);
        SYNC.corriendo=false; SYNC.ultimo=Date.now(); setSync('ok','');
      });
    })
    .catch(function(err){
      SYNC.corriendo=false;
      setSync('err', String(err.message||err).indexOf('404')>=0 ? 'falta la tabla' : '');
    })
    .then(function(){
      if(SYNC.pendiente){ SYNC.pendiente=false; setTimeout(function(){ syncCiclo(); }, 800); }
    });
}

var pushT;
function programaPush(){
  if(typeof syncListo!=='function' || !syncListo()) return;
  clearTimeout(pushT);
  pushT=setTimeout(function(){ syncCiclo(); }, 1800);
}
function guardaLocal(){
  try{
    localStorage.setItem(K+'mat', JSON.stringify(D.mat));
    localStorage.setItem(K+'tar', JSON.stringify(D.tar));
    localStorage.setItem(K+'cal', JSON.stringify(D.cal));
    localStorage.setItem(K+'calts', JSON.stringify(D.calts));
    localStorage.setItem(K+'fin', JSON.stringify(D.fin));
    localStorage.setItem(K+'gen', JSON.stringify(D.gen));
    localStorage.setItem(K+'pap', JSON.stringify(D.pap));
    localStorage.setItem(K+'matpap', JSON.stringify(D.matpap));
    localStorage.setItem(K+'canc', JSON.stringify(D.canc));
    localStorage.setItem(K+'falt', JSON.stringify(D.falt));
  }catch(e){}
}

document.addEventListener('click', function(e){
  var el=e.target, t;

  t=el.closest('.tab'); if(t){ VIEW=t.getAttribute('data-v'); render(); return; }
  t=el.closest('[data-go]'); if(t){ VIEW=t.getAttribute('data-go'); render(); window.scrollTo(0,0); return; }

  t=el.closest('[data-st]'); if(t){
    var T=tarea(t.getAttribute('data-st'));
    if(T){
      T.st=(T.st+1)%3; stamp(T); save(); render();
      var mdEl=document.getElementById('md'), dOpen=mdEl?mdEl.getAttribute('data-diaopen'):null;
      if(dOpen && document.getElementById('ov').classList.contains('on')) modalDia(dOpen);
      if(T.st===2&&T.comp&&(T.cal==null||T.cal==='')) toast('Entregado · falta su calificación');
    }
    return;
  }
  t=el.closest('[data-ed]'); if(t){ modalTarea(t.getAttribute('data-ed')); return; }
  t=el.closest('[data-new]'); if(t){ modalTarea(null); return; }
  t=el.closest('[data-newmat]'); if(t){ modalTarea(null, null, t.getAttribute('data-newmat')); return; }
  if(el.id==='fab'){ modalTarea(null); return; }

  t=el.closest('[data-dia]'); if(t && !el.closest('[data-ed]')){ modalDia(t.getAttribute('data-dia')); return; }
  t=el.closest('[data-dia-ir]'); if(t){ modalDia(t.getAttribute('data-dia-ir')); return; }
  t=el.closest('[data-new-dia]'); if(t){ modalTarea(null, t.getAttribute('data-new-dia')); return; }

  t=el.closest('[data-mes]'); if(t){
    var v=+t.getAttribute('data-mes');
    if(v===0) CALMES=new Date(hoy().getFullYear(), hoy().getMonth(), 1);
    else CALMES=new Date(CALMES.getFullYear(), CALMES.getMonth()+v, 1);
    render(); return;
  }
  t=el.closest('[data-fil-todas]'); if(t){ FILTRO={}; render(); toast('Mostrando todas'); return; }
  t=el.closest('[data-fil]'); if(t){ var id=t.getAttribute('data-fil'); FILTRO[id]=!FILTRO[id]; render(); return; }

  t=el.closest('[data-etapa]'); if(t){ VIEW='ruta'; render(); window.scrollTo(0,0); return; }

  t=el.closest('[data-hs]'); if(t){
    var mv=+t.getAttribute('data-hs');
    if(mv===0) HSEM=null;
    else { var base=HSEM?parseD(HSEM):lunesDe(hoy()); base.setDate(base.getDate()+mv); HSEM=fmtD(base); }
    render(); return;
  }
  t=el.closest('[data-clase]'); if(t){
    var pz3=t.getAttribute('data-clase').split('|');
    modalClase(pz3[0], pz3[1]); return;
  }
  t=el.closest('[data-marcafalta]'); if(t){
    var pf=t.getAttribute('data-marcafalta').split('|'), mo2=document.getElementById('fMot');
    D.falt.push({ id:faltKey(pf[0],pf[1]), m:pf[0], f:pf[1],
                  motivo: mo2?mo2.value.trim():'', off:0, ts:Date.now() });
    save(); cerrar(); render();
    var FR2=faltasDe(pf[0]);
    toast(FR2.rest<=0 ? 'Ya no te quedan faltas ahí' : 'Te quedan '+FR2.rest);
    return;
  }
  t=el.closest('[data-quitafalta]'); if(t){
    var pq=t.getAttribute('data-quitafalta').split('|'), k2=faltKey(pq[0],pq[1]);
    for(var qi=0;qi<D.falt.length;qi++) if(D.falt[qi].id===k2){ D.falt[qi].off=1; D.falt[qi].ts=Date.now(); }
    save(); cerrar(); render(); toast('Falta quitada'); return;
  }
  t=el.closest('[data-falta-mat]'); if(t){ modalFaltaMat(t.getAttribute('data-falta-mat')); return; }
  t=el.closest('[data-pct]'); if(t){
    var v=prompt('¿Qué porcentaje de faltas te permiten? Escribe solo el número.', Math.round(pctFaltas()*100));
    if(v===null) return;
    v=parseFloat(String(v).replace('%','').trim());
    if(isNaN(v)||v<=0||v>100){ toast('Pon un número entre 1 y 100'); return; }
    D.gen.pct=v/100; save(); render(); toast('Límite al '+Math.round(v)+'%'); return;
  }
  t=el.closest('[data-cancelar]'); if(t){
    var pc=t.getAttribute('data-cancelar').split('|');
    var mo=document.getElementById('cMot');
    D.canc.push({ id:cancelKey(pc[0],pc[1]), m:pc[0], f:pc[1],
                  motivo: mo?mo.value.trim():'', off:0, ts:Date.now() });
    save(); cerrar(); render(); toast('Marcada sin clase'); return;
  }
  t=el.closest('[data-descancel]'); if(t){
    var pd=t.getAttribute('data-descancel'), key=pd.replace('|','|');
    for(var ci=0;ci<D.canc.length;ci++) if(D.canc[ci].id===key){ D.canc[ci].off=1; D.canc[ci].ts=Date.now(); }
    save(); cerrar(); render(); toast('Sí hay clase'); return;
  }
  t=el.closest('[data-carga]'); if(t){
    var mc=t.getAttribute('data-carga');
    FILTRO={}; for(var fi=0; fi<D.mat.length; fi++) if(D.mat[fi].id!==mc) FILTRO[D.mat[fi].id]=true;
    VIEW='cal'; render(); window.scrollTo(0,0); toast('Calendario filtrado a '+mat(mc).nombre); return;
  }

  t=el.closest('#detSum'); if(t){
    var db=document.getElementById('detBox'); if(!db) return;
    db.classList.toggle('cerrado');
    var ar=t.querySelector('.ar'); if(ar) ar.textContent = db.classList.contains('cerrado')?'▸':'▾';
    return;
  }
  t=el.closest('[data-d]'); if(t && el.closest('#md')){
    var val=+t.getAttribute('data-d'), TV=tiempo(val);
    var marks=document.querySelectorAll('#regla .rmk'), nb=document.querySelector('.rnone');
    for(var im=0;im<marks.length;im++){
      var mv=tiempo(+marks[im].getAttribute('data-d'));
      var onm=(+marks[im].getAttribute('data-d'))===val;
      marks[im].classList.toggle('on',onm);
      marks[im].style.background = onm?mv.c:''; marks[im].style.borderColor = onm?mv.c:'';
    }
    if(nb) nb.classList.toggle('on', val===0);
    var vd=document.getElementById('vDur');
    if(vd){ vd.textContent = TV?TV.n:'sin tiempo'; vd.style.background = TV?TV.bg:'#EFEAE2'; vd.style.color = TV?TV.fg:'#5A5348'; }
    return;
  }
  t=el.closest('#segTipo button'); if(t){
    var b=t.parentNode.querySelectorAll('button');
    for(var i=0;i<b.length;i++){ b[i].classList.remove('on'); b[i].style.background=''; b[i].style.borderColor=''; b[i].style.color=''; }
    var TS2=tipo(t.getAttribute('data-t'));
    t.classList.add('on'); t.style.borderColor=TS2.c; t.style.background=TS2.bg; t.style.color=TS2.fg;
    var vt=document.getElementById('vTipo');
    if(vt){ vt.textContent=TS2.n; vt.style.background=TS2.bg; vt.style.color=TS2.fg; }
    return;
  }
  t=el.closest('#segEst button'); if(t){
    var sv=+t.getAttribute('data-s'), cont=t.parentNode;
    var nds=cont.querySelectorAll('.nd'), lns=cont.querySelectorAll('.ln');
    for(var n2=0;n2<nds.length;n2++) nds[n2].classList.toggle('on', n2<=sv);
    for(var l2=0;l2<lns.length;l2++) lns[l2].classList.toggle('on', (l2+1)<=sv);
    var ve=document.getElementById('vEst');
    if(ve) ve.textContent=['Por hacer','Haciendo','Entregado'][sv];
    return;
  }
  t=el.closest('[data-pok]'); if(t){
    var pi=+t.getAttribute('data-pok');
    if(PASOS[pi]){ PASOS[pi].ok=!PASOS[pi].ok; pintaPasos(); }
    return;
  }
  t=el.closest('[data-pdel]'); if(t){
    PASOS.splice(+t.getAttribute('data-pdel'),1); pintaPasos(); return;
  }
  t=el.closest('#segDias button'); if(t){ t.classList.toggle('on'); return; }
  t=el.closest('#segCol button');  if(t){ var b3=t.parentNode.querySelectorAll('button'); for(var i3=0;i3<b3.length;i3++){ b3[i3].style.borderWidth='1px'; b3[i3].style.borderColor='var(--line2)'; }
    var C=window._COL[+t.getAttribute('data-c')]; window._COLSEL=C[0]; t.style.borderWidth='2px'; t.style.borderColor=C[0]; return; }

  t=el.closest('[data-cancel]'); if(t){ cerrar(); return; }

  t=el.closest('[data-save]'); if(t){
    var id2=t.getAttribute('data-save');
    var txt=document.getElementById('fT').value.trim();
    if(!txt){ toast('Ponle nombre a la tarea'); return; }
    var tipoSel = document.querySelector('#segTipo button.on');
    var durSel  = document.querySelector('#regla .rmk.on');
    var nds     = document.querySelectorAll('#segEst .nd.on');
    var pend    = document.getElementById('pNuevo');
    if(pend && pend.value.trim()){ PASOS.push({t:pend.value.trim(), ok:false}); }
    var fl = document.getElementById('fF').value;
    var fp = document.getElementById('fP').value;
    if(fp && fl && fp>fl){ toast('La fecha preferida no puede ser después del límite'); return; }
    var obj = {
      t: txt,
      f: fl,
      fpre: (fp && fp!==fl) ? fp : '',
      hora: (document.getElementById('fH')||{value:''}).value,
      m: document.getElementById('fM').value,
      tipo: tipoSel?tipoSel.getAttribute('data-t'):'tarea',
      st: nds.length?nds.length-1:0,
      dur: durSel?+durSel.getAttribute('data-d'):0,
      et: document.getElementById('fE').value,
      comp: document.getElementById('fC').value,
      alim: (document.getElementById('fA')||{value:''}).value,
      nota: document.getElementById('fN').value,
      pasos: PASOS.slice()
    };
    if(id2){ var T2=tarea(id2); for(var kk in obj) T2[kk]=obj[kk]; stamp(T2); }
    else { obj.id='c'+Date.now()+'_'+Math.random().toString(36).slice(2,7); stamp(obj); D.tar.push(obj); }
    save(); cerrar(); render(); toast(id2?'Guardado':'Agregada');
    return;
  }
  t=el.closest('[data-del]'); if(t){
    var did=t.getAttribute('data-del'), TD=tarea(did);
    if(!TD) return;
    if(!confirm('¿Mandar "'+TD.t+'" a la papelera? Puedes recuperarla los próximos '+PAPELERA_DIAS+' días.')) return;
    TD.delAt=Date.now(); stamp(TD);
    D.tar=D.tar.filter(function(T){ return T.id!==did; });
    D.pap.push(TD);
    save(); cerrar(); render(); toast('A la papelera'); return;
  }
  t=el.closest('[data-restaura]'); if(t){
    var rid2=t.getAttribute('data-restaura'), idx=-1;
    for(var ri=0;ri<D.pap.length;ri++) if(D.pap[ri].id===rid2) idx=ri;
    if(idx<0) return;
    var R2=D.pap.splice(idx,1)[0]; delete R2.delAt; stamp(R2); D.tar.push(R2);
    save(); render(); toast('Recuperada'); return;
  }
  t=el.closest('[data-purga]'); if(t){
    if(!confirm('¿Vaciar la papelera de una vez? Esto sí es definitivo.')) return;
    for(var pi=0;pi<D.pap.length;pi++){ D.pap[pi].purgada=1; stamp(D.pap[pi]); D.pap[pi].delAt=1; }
    D.pap=[]; save(); render(); toast('Papelera vacía'); return;
  }

  t=el.closest('[data-mat]'); if(t){ modalMateria(t.getAttribute('data-mat')); return; }
  t=el.closest('[data-matnew]'); if(t){ modalMateria(null, t.getAttribute('data-matnew')); return; }
  t=el.closest('#swClase'); if(t){
    t.classList.toggle('on');
    var on=t.classList.contains('on');
    var sc=document.getElementById('soloClase'); if(sc) sc.style.display = on?'':'none';
    var sx=t.querySelector('small');
    if(sx) sx.textContent = on ? 'aparece en la cuadrícula de arriba' : 'es solo un cajón de tareas, como Trámites';
    return;
  }
  t=el.closest('#segExtra button'); if(t){
    var EX=mat(t.getAttribute('data-ex')), onx=!t.classList.contains('on');
    t.classList.toggle('on', onx);
    t.style.background = onx?EX.c:EX.bg;
    t.style.borderColor = onx?EX.c:'transparent';
    t.style.color = onx?'#fff':EX.fg;
    return;
  }
  t=el.closest('[data-matsave]'); if(t){
    var mid=t.getAttribute('data-matsave');
    var nm=document.getElementById('mN').value.trim();
    if(!nm){ toast('Ponle nombre'); return; }
    var CS=window._COL, sel=window._COLSEL, trio=CS[0];
    for(var c=0;c<CS.length;c++) if(CS[c][0]===sel) trio=CS[c];
    var V=function(x){ var e2=document.getElementById(x); return e2?e2.value.trim():''; };
    var links=[];
    V('mL').split('\n').forEach(function(ln){
      if(!ln.trim()) return;
      var pz=ln.split('|');
      var url=(pz[1]||pz[0]||'').trim();
      var nom=(pz.length>1?pz[0]:'Liga').trim();
      if(url) links.push({n:nom||'Liga', u:url});
    });
    var dias=[], bdias=document.querySelectorAll('#segDias button.on');
    for(var bd2=0; bd2<bdias.length; bd2++) dias.push(+bdias[bd2].getAttribute('data-dia-n'));
    var extra=[], bex=document.querySelectorAll('#segExtra button.on');
    for(var be=0; be<bex.length; be++) extra.push(bex[be].getAttribute('data-ex'));
    var sw=document.getElementById('swClase');
    var esCl = sw ? sw.classList.contains('on') : false;
    var datos={nombre:nm, abr:V('mB'), clase:esCl, extra:extra,
               full:V('mF'), nrc:V('mR'), aula:V('mA'), classroom:V('mC'),
               dias:dias, hini:V('mHi'), hfin:V('mHf'),
               prof:V('mP'), mail:V('mE'), tel:V('mT'), notas:V('mZ'), links:links,
               c:trio[0], bg:trio[1], fg:trio[2]};
    datos.horario = horarioTxt(datos);
    if(mid){ var M2=mat(mid); for(var kz in datos) M2[kz]=datos[kz]; stamp(M2); }
    else {
      datos.id='m'+Date.now();
      var mx=0; for(var mo=0;mo<D.mat.length;mo++) if((D.mat[mo].ord||0)>mx) mx=D.mat[mo].ord;
      datos.ord=mx+1; stamp(datos); D.mat.push(datos);
    }
    save(); cerrar(); render(); return;
  }
  t=el.closest('[data-matdel]'); if(t){
    var mdel=t.getAttribute('data-matdel');
    var n=D.tar.filter(function(T){ return T.m===mdel; }).length;
    if(!confirm(n? ('Esta materia tiene '+n+' pendientes. Se moverán a '+D.mat[0].nombre+'. ¿Continuar?') : '¿Borrar materia?')) return;
    D.tar.forEach(function(T){ if(T.m===mdel) T.m=D.mat[0].id==='mdel'?D.mat[1].id:D.mat[0].id; });
    D.mat=D.mat.filter(function(M){ return M.id!==mdel; });
    save(); cerrar(); render(); return;
  }

  if(el.id==='btnBackup'){ modalBackup(); return; }
  t=el.closest('[data-backup]'); if(t){ modalBackup(); return; }
  t=el.closest('[data-copy]'); if(t){
    var ta=document.getElementById('bkOut'); ta.select();
    try{ document.execCommand('copy'); toast('Copiado'); }catch(err){ toast('Selecciona y copia a mano'); }
    return;
  }
  t=el.closest('[data-import]'); if(t){
    var raw=document.getElementById('bkIn').value.trim();
    if(!raw){ toast('Pega un código'); return; }
    try{
      var obj2=JSON.parse(decodeURIComponent(escape(atob(raw))));
      if(!obj2.tar) throw 0;
      if(!confirm('Esto reemplaza todo lo que tienes aquí. ¿Seguro?')) return;
      splitTar(obj2.tar); splitMat(obj2.mat||allMat());
      D.cal=obj2.cal||{}; D.calts=obj2.calts||{}; D.fin=obj2.fin||D.fin; D.gen=obj2.gen||{};
      save(); cerrar(); render(); toast('Importado');
    }catch(err){ toast('Ese código no se pudo leer'); }
    return;
  }
  t=el.closest('[data-fusion]'); if(t){
    var raw2=document.getElementById('bkIn').value.trim();
    if(!raw2){ toast('Pega un código'); return; }
    try{
      var obj3=JSON.parse(decodeURIComponent(escape(atob(raw2))));
      if(!obj3.tar) throw 0;
      if(obj3.v!==2){ toast('Ese código es de una versión vieja, usa Reemplazar'); return; }
      aplicarRemoto(obj3); save(); cerrar(); render(); toast('Fusionado');
    }catch(err){ toast('Ese código no se pudo leer'); }
    return;
  }
  t=el.closest('[data-sync]'); if(t){
    if(!syncListo()){ toast('Llena URL, llave y código'); return; }
    toast('Sincronizando…'); syncCiclo(true).then(function(){ toast(SYNC.estado==='ok'?'Al día':'No se pudo conectar'); });
    return;
  }
  t=el.closest('[data-sql]'); if(t){ modalSQL(); return; }

  if(el.id==='ov'){ cerrar(); return; }
});

document.addEventListener('change', function(e){
  var el=e.target, id;
  if((id=el.getAttribute('data-cal'))){
    var v=el.value.trim();
    if(v==='') delete D.cal[id]; else D.cal[id]=+v;
    D.calts[id]=Date.now();
    save(); render(); return;
  }
  if((id=el.getAttribute('data-maxf'))){
    var MX=mat(id); MX.maxF = el.value.trim()===''?null:+el.value; stamp(MX);
    save(); render(); modalFaltaMat(id); return;
  }
  if((id=el.getAttribute('data-rub'))){
    var pz2=id.split('|'), MR2=mat(pz2[0]);
    if(MR2.rubros) for(var ri=0;ri<MR2.rubros.length;ri++)
      if(MR2.rubros[ri].id===pz2[1]) MR2.rubros[ri].v = el.value.trim()===''?null:+el.value;
    stamp(MR2); save(); render(); return;
  }
  if((id=el.getAttribute('data-fin'))){
    for(var i=0;i<D.fin.length;i++) if(D.fin[i].id===id){ D.fin[i].v = el.value.trim()===''?null:+el.value; stamp(D.fin[i]); }
    save(); render(); return;
  }
  if((id=el.getAttribute('data-tcal'))){
    var T=tarea(id); if(T){ T.cal = el.value.trim()===''?null:+el.value; if(T.cal!=null && T.st!==2) T.st=2; stamp(T); save(); render(); }
    return;
  }
  if(el.id==='cfgUrl'||el.id==='cfgKey'||el.id==='cfgCode'){
    CFG.url=(document.getElementById('cfgUrl')||{}).value||'';
    CFG.key=(document.getElementById('cfgKey')||{}).value||'';
    CFG.code=(document.getElementById('cfgCode')||{}).value||'';
    try{ localStorage.setItem(K+'cfg', JSON.stringify(CFG)); }catch(e2){}
    setSync(syncListo()?'run':'off','');
    if(syncListo()) syncCiclo(true);
    return;
  }
});

document.addEventListener('keydown', function(e){
  if(e.key==='Escape'){ cerrar(); return; }
  if(e.key!=='Enter') return;
  var el=e.target;
  /* Enter en el título de una tarea nueva: abre los detalles */
  if(el.id==='fT'){
    e.preventDefault();
    var db=document.getElementById('detBox');
    if(db && db.classList.contains('cerrado')){
      db.classList.remove('cerrado');
      var ar=document.querySelector('#detSum .ar'); if(ar) ar.textContent='▾';
    }
    el.blur();
    return;
  }
  /* Enter en el campo de paso: lo agrega y deja listo el siguiente */
  if(el.id==='pNuevo'){
    e.preventDefault();
    var v=el.value.trim(); if(!v) return;
    PASOS.push({t:v, ok:false}); el.value=''; pintaPasos(); el.focus();
    return;
  }
});

document.addEventListener('input', function(e){
  if(e.target && e.target.id==='fN') autoCrecer(e.target);
});

/* disparadores de sincronización */
document.addEventListener('visibilitychange', function(){ if(!document.hidden) syncCiclo(); });
window.addEventListener('focus', function(){ syncCiclo(); });
window.addEventListener('online', function(){ syncCiclo(); });
setInterval(function(){ syncCiclo(); }, 20000);

render();
syncUI();
if(syncListo()) syncCiclo(true);
</script>
</body>
</html>
